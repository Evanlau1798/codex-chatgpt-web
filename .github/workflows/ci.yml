name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lifecycle-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Install pinned native lifecycle clients
        run: npm install --global @openai/codex@0.150.1 @anthropic-ai/claude-code@2.1.251
      - run: bun run lifecycle:sim --lane=all

  lifecycle-client-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Install pinned Codex client
        run: npm install --global @openai/codex@0.150.1
      - name: Print safe client environment
        run: >-
          bun -e 'console.log(JSON.stringify({ platform: process.platform, arch: process.arch, bun: Bun.version }))'
      - run: codex --version
      - run: bun run scripts/smoke-codex-cancel.ts
      - run: bun run scripts/smoke-codex-interrupt.ts
      - name: Probe the Windows named-pipe broker
        if: runner.os == 'Windows'
        working-directory: tests
        run: bun test turn-broker-lifecycle.test.ts --test-name-pattern "turn broker creates its private runtime directory"

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate launcher installer with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $source = Get-Content scripts/install-launcher.ps1 -Raw
          [void][scriptblock]::Create($source)
          if ($source.Contains("IsPathFullyQualified")) {
            throw "The Windows PowerShell 5.1 installer cannot use the .NET Core-only IsPathFullyQualified API"
          }
          if (-not [Environment]::Is64BitOperatingSystem) {
            throw "The Windows CI runner must be 64-bit"
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -Revision 1.4.0+34cbb9a40 -GitHubEnv $env:GITHUB_ENV
      - name: Prepare compatible Linux libnotify
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev binutils
          ./scripts/prepare-linux-libnotify.sh
      - name: Prepare owned AppImage toolset
        if: runner.os == 'Linux'
        run: bun run launcher/scripts/prepare-linux-appimage-tools.cjs
      - run: bun run verify
      - run: bun run app:package
      - name: Verify Linux AppImage ABI on current Arch
        if: runner.os == 'Linux'
        run: |
          artifact="$(find launcher/artifacts -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$artifact"
          docker run --rm -v "$PWD:/work:ro" -e APPIMAGE_PATH="/work/$artifact" archlinux:base \
            sh -lc 'pacman -Sy --noconfirm binutils file glibc alsa-lib at-spi2-core cairo cups gtk3 libx11 libxcb libxcomposite libxdamage libxext libxfixes libxkbcommon libxrandr mesa nspr nss pango >/dev/null && /work/launcher/scripts/smoke-linux-appimage-symbols.sh "$APPIMAGE_PATH"'
      - name: Ensure virtual display is available
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: bun run app:smoke

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -config-file .github/actionlint.yaml .github/workflows/*.yml

  ci-gate:
    if: ${{ always() }}
    needs: [lifecycle-sim, lifecycle-client-probe, verify, actionlint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preserve the pinned upstream v5 ancestry
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git merge-base --is-ancestor 9a7428a9d1fced9baaa85112994c02c011a3b7c9 "$CANDIDATE_HEAD"
      - name: Require every CI dependency to succeed
        env:
          LIFECYCLE_SIM_RESULT: ${{ needs['lifecycle-sim'].result }}
          CLIENT_PROBE_RESULT: ${{ needs['lifecycle-client-probe'].result }}
          VERIFY_RESULT: ${{ needs['verify'].result }}
          ACTIONLINT_RESULT: ${{ needs['actionlint'].result }}
        run: |
          test "$LIFECYCLE_SIM_RESULT" = "success"
          test "$CLIENT_PROBE_RESULT" = "success"
          test "$VERIFY_RESULT" = "success"
          test "$ACTIONLINT_RESULT" = "success"
