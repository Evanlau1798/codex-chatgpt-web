name: Windows broker protocol probe
on:
  pull_request:
    paths:
      - 'src/adapters/chatgpt-web/turn-broker*.ts'
      - 'tests/dev-chat-broker.test.ts'
      - 'tests/turn-broker-frame-settlement.test.ts'
      - 'tests/turn-broker-delayed-response.test.ts'
      - '.github/workflows/broker-windows-probe.yml'
permissions:
  contents: read
jobs:
  windows-broker:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Probe the transport without turn owners
        run: bun test tests/turn-broker-delayed-response.test.ts
        env:
          CODEX_CHATGPT_WEB_BROKER_TRACE: '1'
      - name: Probe owner lifecycle and frame validation
        run: bun test --no-orphans tests/dev-chat-broker.test.ts tests/turn-broker-frame-settlement.test.ts
        env:
          CODEX_CHATGPT_WEB_BROKER_TRACE: '1'
      - name: Probe the completion and compaction boundaries with full-runner flags
        run: bun test --no-orphans tests/turn-broker-lifecycle.test.ts tests/turn-broker-compaction.test.ts tests/turn-broker-compaction-control.test.ts
        env:
          CODEX_CHATGPT_WEB_BROKER_TRACE: '1'
