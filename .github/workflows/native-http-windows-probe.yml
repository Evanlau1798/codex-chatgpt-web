name: Windows Native MCP HTTP probe
on:
  pull_request:
    paths:
      - 'src/adapters/chatgpt-web/mcp-http-server.ts'
      - 'tests/native-mcp-http.test.ts'
      - '.github/workflows/native-http-windows-probe.yml'
permissions:
  contents: read
jobs:
  windows-mcp-http:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test --no-orphans tests/native-mcp-http.test.ts
